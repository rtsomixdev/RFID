persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# =================================================================
# 1. Default MQTT TCP Listener (สำหรับ Backend .NET และ ESP32)
# =================================================================
# เปิด Port 1883 และผูกกับ 0.0.0.0 เพื่อให้อนุญาตการเชื่อมต่อจากทุก IP ภายนอก
listener 1883 0.0.0.0
allow_anonymous true

# =================================================================
# 2. WebSockets Listener (เผื่ออนาคต)
# =================================================================
# หากหน้าเว็บ React ต้องการ Subscribe MQTT โดยตรงโดยไม่ผ่าน Backend 
# ให้เอาเครื่องหมาย # ด้านล่างออก เพื่อเปิด Port 9001 สำหรับ WebSockets
# listener 9001 0.0.0.0
# protocol websockets