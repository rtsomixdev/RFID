version: '3.8'

services:
  # 1. Database (รันใน Docker เหมือนเดิม)
  db:
    image: postgres:15-alpine
    container_name: linen_postgres_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=linen_db
    ports:
      - "5432:5432" # เปิด Port ให้ .NET บน Windows วิ่งเข้ามาได้
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    networks:
      - linen_network

  # 2. pgAdmin (รันใน Docker เหมือนเดิม)
  pgadmin:
    image: dpage/pgadmin4
    container_name: linen_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@linen.com
      - PGADMIN_DEFAULT_PASSWORD=123456
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    restart: always
    networks:
      - linen_network

  # 3. MQTT Broker (Mosquitto) - ✅ เพิ่มใหม่
  mosquitto:
    image: eclipse-mosquitto
    container_name: linen_mosquitto
    ports:
      - "1883:1883" # Port สำหรับ Hardware (ESP32) และ Backend
      - "9001:9001" # Port สำหรับ WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always
    networks:
      - linen_network

  # 4. Cloudflare Tunnel (แก้ให้วิ่งหา Windows ของคุณ)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: linen_tunnel
    restart: always
    # 👇 ชี้ไปที่ host.docker.internal (คือเครื่อง Windows ของคุณที่รัน npm run dev)
    # Port 5173 คือ Port ที่ Vite รันบนเครื่องคุณ
    command: tunnel --url http://host.docker.internal:5173
    extra_hosts:
      - "host.docker.internal:host-gateway" # บรรทัดนี้สำคัญ! ช่วยให้ Docker คุยกับ Windows รู้เรื่อง
    networks:
      - linen_network

volumes:
  pg_data:

networks:
  linen_network:
    driver: bridge